name: EPDP build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Testar os 20 jogos e as 160 fases
        run: npm run test:games
      - name: Testar acesso, curso e avaliações
        run: npm run test:learning
      - name: Verificar TypeScript e gerar build
        run: npm run build
